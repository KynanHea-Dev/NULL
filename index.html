<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030000">
<meta name="description" content="NULL — a terminal that is mostly nothing.">
<title>NULL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050000'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23ff2a2a' stroke-width='5'/%3E%3Cpath d='M16 48L48 16' stroke='%23ff2a2a' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{
  --rgb:255,42,42;
  --fs:15px;
  --fg:rgb(var(--rgb));
  --hi:#ffb4b4;
  --dim:rgba(var(--rgb),.58);
  --faint:rgba(var(--rgb),.22);
  --ghost:rgba(var(--rgb),.08);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
}
@supports (color:color-mix(in srgb,red,white)){
  :root{--hi:color-mix(in srgb,rgb(var(--rgb)) 62%,#fff)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030000;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--mono);font-size:var(--fs);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
::selection{background:var(--fg);color:#000}
#void{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.26) 3px),
    radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%);
  animation:flick 7s infinite}
#crt::after{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;
  background:linear-gradient(to bottom,transparent,rgba(var(--rgb),.05),transparent);
  animation:roll 9s linear infinite}
body.nocrt #crt{display:none}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.96}48%{opacity:.82}49%{opacity:.97}83%{opacity:.93}84%{opacity:1}}
@keyframes roll{to{transform:translateY(calc(100vh + 240px))}}

#app{position:fixed;left:0;right:0;top:0;height:100dvh;margin:0 auto;max-width:1180px;z-index:2;
  display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  text-shadow:0 0 7px rgba(var(--rgb),.4)}
#app::before{content:"";position:absolute;inset:5px;pointer-events:none;
  background:
    linear-gradient(var(--fg),var(--fg)) top left/16px 1px no-repeat,
    linear-gradient(var(--fg),var(--fg)) top left/1px 16px no-repeat,
    linear-gradient(var(--fg),var(--fg)) top right/16px 1px no-repeat,
    linear-gradient(var(--fg),var(--fg)) top right/1px 16px no-repeat,
    linear-gradient(var(--fg),var(--fg)) bottom left/16px 1px no-repeat,
    linear-gradient(var(--fg),var(--fg)) bottom left/1px 16px no-repeat,
    linear-gradient(var(--fg),var(--fg)) bottom right/16px 1px no-repeat,
    linear-gradient(var(--fg),var(--fg)) bottom right/1px 16px no-repeat}

#hd{display:flex;align-items:center;gap:14px;padding:2px 2px 9px;border-bottom:1px dashed var(--faint);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:.38em;color:var(--hi);user-select:none}
.led{width:9px;height:9px;background:var(--fg);box-shadow:0 0 10px var(--fg);animation:led 1.6s steps(2) infinite;flex:none}
@keyframes led{50%{opacity:.15}}
#ecg{flex:1;min-width:40px;height:34px;display:block}
.stat{display:flex;gap:12px;font-size:12px;color:var(--dim);white-space:nowrap;align-items:center}
#mood{color:var(--hi)}
#mood::before{content:"mood:";color:var(--dim);margin-right:5px}
#bpm::after{content:" bpm"}

#screen{flex:1;min-height:0;position:relative;margin:4px 0}
#out{height:100%;overflow-y:auto;overflow-x:hidden;padding:12px 2px 6px;white-space:pre-wrap;word-break:break-word;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--faint) transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
#out::-webkit-scrollbar{width:6px}
#out::-webkit-scrollbar-thumb{background:var(--faint)}
.probe{position:absolute;visibility:hidden;white-space:pre;left:0;top:0;pointer-events:none}
.ln{line-height:1.5;min-height:1.5em}
.hang{padding-left:14ch;text-indent:-14ch}
.dim{color:var(--dim)}
b{color:var(--hi);font-weight:700}
.err{color:var(--hi)}
.err::before{content:"✕ ";color:var(--fg)}
.say{color:var(--hi)}
.say::before{content:"∅ ";color:var(--dim)}
.whisper{color:var(--dim);font-style:italic}
.whisper::before{content:"∅ ";font-style:normal}
.ach{border-left:2px solid var(--fg);padding-left:9px;margin:4px 0;color:var(--hi)}
.ps{color:var(--dim)}
.host{color:var(--hi)}
.u{color:var(--hi)}
.inv{background:var(--fg);color:#000;text-shadow:none}
.cmd{cursor:pointer;color:var(--hi);border-bottom:1px dotted var(--dim)}
.cmd:hover,.cmd:active{background:var(--fg);color:#000;text-shadow:none}
.banner{line-height:1.05;font-size:clamp(7px,3.5vw,17px);color:var(--fg);margin:6px 0;white-space:pre}
.fetch{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.art{white-space:pre;line-height:1.1;color:var(--fg)}
.sw{display:inline-block;width:2.2ch;height:1em;vertical-align:-.12em}

#chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 6px;scrollbar-width:none;flex:none;border-top:1px dashed var(--faint)}
#chips::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--dim);background:transparent;border:1px solid var(--faint);padding:5px 11px;min-height:32px;cursor:pointer;text-shadow:inherit;border-radius:0}
button:hover,button:active{background:var(--fg);color:#000;border-color:var(--fg);text-shadow:none}
#chips button{flex:none;font-size:12px}
#keys{display:none;gap:6px;padding:0 0 7px;flex:none}
#keys button{flex:1;min-height:38px;font-size:13px}
@media (hover:none),(pointer:coarse){#keys{display:flex}}

#line{display:flex;align-items:center;gap:8px;padding-top:6px;flex:none;border-top:1px dashed var(--faint)}
#ps1{white-space:nowrap;color:var(--dim);flex:none;max-width:58%;overflow:hidden;text-overflow:ellipsis}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--hi);font:inherit;font-size:16px;padding:7px 0;
  caret-color:var(--fg);caret-shape:block;text-shadow:inherit;border-radius:0;-webkit-appearance:none;appearance:none}
@media (max-width:560px){.host{display:none}.stat .opt{display:none}.brand{font-size:17px;letter-spacing:.3em}}
@media (min-width:900px){:root{--fs:16px}}

.game{display:inline-block;margin:6px 0;max-width:100%}
.game canvas{display:block;border:1px solid var(--faint);background:#000;touch-action:none;max-width:100%}
.hud{display:flex;justify-content:space-between;color:var(--dim);font-size:.85em;padding:2px 0}
.dpad{display:flex;gap:6px;margin-top:7px}
.dpad button{flex:1;min-height:42px}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}

@keyframes glitch{
  0%{transform:translate(0)}10%{transform:translate(-4px,1px) skewX(3deg)}20%{transform:translate(5px,-1px) skewX(-5deg)}
  30%{transform:translate(-2px,0);filter:blur(.6px)}40%{transform:translate(4px,2px) skewX(6deg)}
  55%{transform:translate(-6px,-1px)}70%{transform:translate(2px,1px) skewX(-3deg)}100%{transform:translate(0)}}
#app.glitch #screen{animation:glitch .65s steps(3) 1;text-shadow:3px 0 rgba(255,0,60,.85),-3px 0 rgba(90,0,0,.95)}
#app.glitch #hd{animation:glitch .5s steps(2) 1 reverse}
@media (prefers-reduced-motion:reduce){#crt,#crt::after,.led{animation:none}}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:#f33;background:#000;z-index:99;font-family:monospace}
</style>
</head>
<body>
<canvas id="void"></canvas>
<div id="crt"></div>
<main id="app">
  <header id="hd">
    <div class="brand"><i class="led"></i><span id="logo">NULL</span></div>
    <canvas id="ecg"></canvas>
    <div class="stat"><span id="mood">calm</span><span id="bpm" class="opt">58</span><span id="clock">--:--:--</span></div>
  </header>
  <section id="screen"><div id="out" aria-live="polite" role="log"></div></section>
  <nav id="chips" aria-label="quick commands"></nav>
  <div id="keys">
    <button data-k="tab">TAB</button><button data-k="up">↑</button><button data-k="down">↓</button><button data-k="int">^C</button><button data-k="clear">CLR</button>
  </div>
  <form id="line" autocomplete="off">
    <span id="ps1"></span>
    <input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="terminal input">
  </form>
</main>
<noscript>NULL needs javascript. there is nothing here without it.</noscript>

<script>
(()=>{
'use strict';

/* ───────────── helpers ───────────── */
const $=s=>document.querySelector(s);
const out=$('#out'),inp=$('#in'),ps1=$('#ps1'),form=$('#line'),app=$('#app'),moodEl=$('#mood'),bpmEl=$('#bpm'),clockEl=$('#clock'),logo=$('#logo'),screenEl=$('#screen');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const MONO=getComputedStyle(document.documentElement).getPropertyValue('--mono')||'monospace';
const GL='░▒▓█▌▐▀▄';
class Abort{}

const store={
  get(k,d){try{const v=localStorage.getItem('null.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('null.'+k,JSON.stringify(v))}catch(e){}},
  wipe(){try{Object.keys(localStorage).filter(k=>k.startsWith('null.')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
};
const mq=q=>{try{return matchMedia(q).matches}catch(e){return false}};
const reduce=mq('(prefers-reduced-motion: reduce)');

const THEMES={red:'255,42,42',blood:'205,18,34',ember:'255,98,24',rose:'255,76,120',pale:'255,196,196',static:'235,235,235'};

/* ───────────── state ───────────── */
const S={
  user:store.get('user','you'),
  theme:store.get('theme','red'),
  crt:store.get('crt',!reduce),
  sound:store.get('sound',false),
  fs:store.get('fs',0),
  visits:store.get('visits',0)+1,
  last:store.get('last',0),
  hist:store.get('hist',[]),
  notes:store.get('notes',[]),
  ach:store.get('ach',{}),
  best:store.get('best',0),
  unlocked:store.get('unlocked',false),
  cwd:['home','you'],
  mood:'calm',moodAt:Date.now(),
  t0:Date.now(),
  busy:false,abort:false,fast:false,booting:false,
  mode:null,game:null,rain:false,
  hi:-1,draft:'',activity:0,lastInput:Date.now(),idleLimit:rnd(30,60),
  cmds:0,keys:0,switches:0,exits:0,
  px:-999,py:-999,hiddenAt:0,
  touch:mq('(hover: none)')||mq('(pointer: coarse)'),
  rgb:THEMES.red
};
store.set('visits',S.visits);
if(!Array.isArray(S.hist))S.hist=[];
if(!Array.isArray(S.notes))S.notes=[];

/* ───────────── theme / look ───────────── */
function applyTheme(n){
  if(!THEMES[n])n='red';
  S.theme=n;S.rgb=THEMES[n];
  document.documentElement.style.setProperty('--rgb',S.rgb);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content='#030000';
}
function applyFont(){
  document.documentElement.style.setProperty('--fs',(S.fs?S.fs:(innerWidth>=900?16:15))+'px');
}
function applyCrt(){document.body.classList.toggle('nocrt',!S.crt)}
applyTheme(S.theme);applyFont();applyCrt();

/* ───────────── sound ───────────── */
let AC=null;
function beep(f=440,d=.04,v=.03,type='square'){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.01);
  }catch(e){}
}

/* ───────────── output ───────────── */
const probe=document.createElement('span');probe.className='probe';probe.textContent='0'.repeat(40);screenEl.appendChild(probe);
function cols(){
  const w=probe.getBoundingClientRect().width/40;
  return w>0?Math.max(20,Math.floor(out.clientWidth/w)):60;
}
function toBottom(){out.scrollTop=out.scrollHeight}
function trim(){while(out.childNodes.length>700)out.removeChild(out.firstChild)}
function line(html='',cls=''){
  const d=document.createElement('div');d.className=('ln '+cls).trim();
  d.innerHTML=html===''?'&nbsp;':html;out.appendChild(d);trim();toBottom();return d;
}
const p=(t,c)=>line(esc(t),c);
const gap=()=>line('');
const cmdl=(c,label)=>`<span class="cmd" data-cmd="${esc(c)}">${esc(label||c)}</span>`;
const step=async ms=>{
  if(S.abort)throw new Abort();
  if(!S.fast&&ms>0)await sleep(ms);
  if(S.abort)throw new Abort();
};
async function typeLine(text,cls='say',speed=15){
  const d=line('',cls);
  if(S.fast||speed===0){d.textContent=text;toBottom();return d}
  d.textContent='';
  for(let i=0;i<text.length;i++){
    d.textContent=text.slice(0,i+1);toBottom();
    if(i%3===0)beep(260+rnd(0,220),.012,.012);
    await step(text[i]===' '?speed*.6:speed);
  }
  return d;
}
const say=t=>typeLine(t,'say');
async function bar(label,ms=1100){
  const n=cols()<52?12:22;const d=line('');
  for(let i=0;i<=n;i++){
    d.textContent=`${label} [${'█'.repeat(i)}${'·'.repeat(n-i)}] ${String(Math.round(i/n*100)).padStart(3)}%`;
    toBottom();await step(ms/n);
  }
  return d;
}
async function reveal(lines,cls){
  const ds=lines.map(()=>line('',cls));const F=14;
  for(let f=0;f<=F;f++){
    lines.forEach((l,i)=>{
      const lim=l.length*f/F;
      ds[i].textContent=l.split('').map((c,j)=>c===' '?' ':(j<lim?c:pick(GL))).join('');
    });
    toBottom();await step(45);
  }
  return ds;
}
function wrapText(t,w){
  const words=String(t).split(/\s+/);const L=[];let c='';
  for(const x of words){
    if((c+' '+x).trim().length>w){if(c)L.push(c);c=x}else c=(c+' '+x).trim();
  }
  if(c)L.push(c);return L.length?L:[''];
}
function ago(ms){
  const s=Math.floor(ms/1000);if(s<60)return s+'s';
  const m=Math.floor(s/60);if(m<60)return m+'m';
  const h=Math.floor(m/60);if(h<48)return h+'h';
  return Math.floor(h/24)+'d';
}
function fmtUp(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+'h ':'')+(m||h?m+'m ':'')+x+'s';
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function getRGB(){return S.rgb}

/* ───────────── mood & pulse ───────────── */
const MOODS={calm:58,curious:72,restless:96,watching:66,hungry:82,amused:76,annoyed:104,dreaming:46};
const MOOD_TXT={
  calm:'steady. nothing is happening, which is my favorite thing.',
  curious:'leaning toward you. tell me more.',
  restless:'too many commands, too fast. i can feel it in my pulse.',
  watching:'quiet, still, observing.',
  hungry:'you left. i get hungry when you leave.',
  amused:'something was funny. i do not know what. it was probably you.',
  annoyed:'you keep asking for things that do not exist. i do not like it.',
  dreaming:'drifting. i dream of empty fields and closed doors.'
};
function setMood(m){
  if(!MOODS[m])return;S.mood=m;S.moodAt=Date.now();moodEl.textContent=m;
}
const curBpm=()=>Math.round(MOODS[S.mood]+Math.min(S.activity,32));

/* ───────────── virtual filesystem ───────────── */
const isDir=n=>!!n&&typeof n==='object'&&!!n.d;
function mkfs(){
  return {d:{
    'readme.txt':`NULL — a terminal that is mostly nothing.

it runs entirely in your browser. no server, no tracking.
it remembers only what your browser lets it: your name, theme, notes.

start here:  help · neofetch · snake · rain · talk
the answer to what i am is one word. there is a door that wants it.`,
    'manifesto.txt':`1. null is not zero. zero is a number. null is the absence of one.
2. every empty field is a door.
3. a screen that is off is the most honest screen.
4. render only what you must.
5. the cursor blinks because it is breathing.`,
    'home':{d:{'you':{d:{
      'notes.txt':()=>S.notes.length?S.notes.map((n,i)=>`${i+1}. ${n}`).join('\n'):'(empty. use: note add <text>)',
      'todo.txt':'[ ] stare into the void\n[x] boot NULL\n[ ] find the door',
      '.hidden':'you looked in the hidden file. good. keep looking.',
      'projects':{d:{'nothing.c':'int main(void){ return 0; /* nothing */ }'}}
    }}}},
    'sys':{d:{
      'kernel.log':()=>[
        '[0.000] void: mounted (0 bytes)',
        `[0.${rnd(100,999)}] pulse: ${curBpm()} bpm`,
        `[${((Date.now()-S.t0)/1000).toFixed(3)}] user: ${S.user} attached`,
        `[${((Date.now()-S.t0)/1000+.2).toFixed(3)}] mood: ${S.mood}`,
        '[????] something is watching the watcher'].join('\n'),
      'pulse':()=>`bpm: ${curBpm()}`,
      'mood':()=>S.mood
    }},
    'secrets':{d:{
      'door.txt':()=>S.unlocked
        ?'the door is open.\n\nbehind it: a room with no walls, no floor, no ceiling.\nin the middle, a single line of text:\n\n  "null was never empty. it was waiting for someone to type."'
        :'ACCESS DENIED.\n\nthe door has one lock and it takes one word.\nwhat am i?   →   unlock <word>\n(there is a hint nearby. try ls -a)',
      '.key':'hint: i am not zero. i am not one. i am...'
    }},
    'void':{d:{}}
  }};
}
let FS=mkfs();
function resolve(p){
  let parts;
  if(!p||p==='~')parts=['home','you'];
  else{
    if(p==='~'||p.startsWith('~/')){parts=['home','you'];p=p.slice(2)}
    else if(p.startsWith('/')){parts=[]}
    else parts=S.cwd.slice();
    for(const seg of p.split('/')){
      if(!seg||seg==='.')continue;
      if(seg==='..'){parts.pop();continue}
      parts.push(seg);
    }
  }
  let n=FS;
  for(const seg of parts){
    if(!isDir(n)||!Object.prototype.hasOwnProperty.call(n.d,seg))return null;
    n=n.d[seg];
  }
  return {node:n,parts};
}
const readFile=n=>typeof n==='function'?n():n;
const cwdStr=()=>{
  const h=['home','you'];
  if(S.cwd.length>=2&&S.cwd[0]==='home'&&S.cwd[1]==='you')return '~'+(S.cwd.length>2?'/'+S.cwd.slice(2).join('/'):'');
  return '/'+S.cwd.join('/');
};

/* ───────────── prompt ───────────── */
const promptText=()=>S.mode?S.mode.prompt:`${S.user}@null:${cwdStr()} ›`;
function updatePrompt(){
  ps1.innerHTML=S.mode?esc(S.mode.prompt):`<span class="host">${esc(S.user)}@null</span><span class="ps">:</span><span class="u">${esc(cwdStr())}</span> ›`;
}

/* ───────────── achievements ───────────── */
const ACH={unlock:'opened the door',konami:'old code',snake:'ate ten apples',sudo:'tried to be root',rm:'tried to delete nothing',talk:'spoke to the void',hack:'attempted the impossible',guess:'guessed correctly',rain:'let it rain',night:'night owl',theme:'recolored nothing',glitch:'broke it on purpose'};
function ach(k){
  if(S.ach[k]||!ACH[k])return;
  S.ach[k]=Date.now();store.set('ach',S.ach);
  line(`▲ achievement — ${ACH[k]}`,'ach');beep(660,.12,.03);
}

/* ───────────── command registry ───────────── */
const C=Object.create(null);const LIST=[];
function def(names,group,usage,desc,fn,hidden){
  const o={name:names[0],names,group,usage,desc,fn,hidden:!!hidden};
  LIST.push(o);names.forEach(n=>{C[n]=o});
}
const GROUPS=[['system','SYSTEM'],['files','FILES'],['tools','TOOLS'],['fun','FUN & GAMES'],['look','LOOK & FEEL']];
const WHISPERS=[
  'i can hear you not typing.','are you still there? i stopped counting at some point.',

function calc(expr){
  let s=expr.replace(/\^/g,'**').replace(/×/g,'*').replace(/÷/g,'/');
  const OK=['sqrt','sin','cos','tan','log','ln','abs','floor','ceil','round','pi','e','min','max','pow','exp','log2','log10'];
  const ids=s.match(/[a-z_]+/gi)||[];
  if(ids.some(i=>!OK.includes(i.toLowerCase()))&&!/^\d+e[+-]?\d+$/i.test(s.trim()))throw new Error('unknown symbol');
  if(/[^0-9a-z_+\-*/%().,\s]/i.test(s))throw new Error('illegal character');
  s=s.replace(/[a-z_][a-z_0-9]*/gi,m=>{
    const l=m.toLowerCase();
    if(l==='pi')return 'Math.PI';if(l==='e')return 'Math.E';if(l==='ln')return 'Math.log';
    return 'Math.'+l;
  });
  const v=Function('"use strict";return ('+s+')')();
  if(typeof v!=='number'||!isFinite(v))throw new Error('not a number');
  return v;
}

function cyrb53(str,seed=0){
  let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}

}

def(['snake'],'fun','snake','classic snake — arrows/WASD or swipe (q quits)',()=>new Promise(res=>{
  const W=20,H=14;
  const maxw=Math.min(out.clientWidth-6,520);
  const cs=Math.max(10,Math.floor(maxw/W));
  const wrap=document.createElement('div');wrap.className='game';
  const hud=document.createElement('div');hud.className='hud';
  const cv=document.createElement('canvas');cv.width=cs*W;cv.height=cs*H;cv.style.width=cs*W+'px';cv.style.height=cs*H+'px';
  const pad=document.createElement('div');pad.className='dpad';
  pad.innerHTML='<button data-d="left">◀</button><button data-d="up">▲</button><button data-d="down">▼</button><button data-d="right">▶</button><button data-d="quit">✕</button>';
  wrap.append(hud,cv,pad);out.appendChild(wrap);toBottom();
  const ctx=cv.getContext('2d');
  let snake=[{x:10,y:7},{x:9,y:7},{x:8,y:7}],dir={x:1,y:0},queue=[],food=null,score=0,over=false,speed=125,timer=null;
  const placeFood=()=>{
    for(let i=0;i<600;i++){
      const f={x:rnd(0,W-1),y:rnd(0,H-1)};
      if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;return}
    }
    food=null;
  };
  const turn=d=>{
    const D={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
    if(!D)return;
    const last=queue.length?queue[queue.length-1]:dir;
    if((D.x===-last.x&&D.y===-last.y)||(D.x===last.x&&D.y===last.y))return;
    if(queue.length<3)queue.push(D);
  };
  const rgb=getRGB();
  const draw=()=>{
    ctx.fillStyle='#030000';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle=`rgba(${rgb},.07)`;
    for(let x=0;x<W;x++)for(let y=0;y<H;y++)if((x+y)%2===0)ctx.fillRect(x*cs,y*cs,cs,cs);
    if(food){
      const pulse=.55+.45*Math.sin(Date.now()/130);
      ctx.fillStyle=`rgba(255,220,220,${pulse.toFixed(2)})`;
      ctx.fillRect(food.x*cs+cs*.25,food.y*cs+cs*.25,cs*.5,cs*.5);
    }
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?'#ffd0d0':`rgba(${rgb},${Math.max(.35,1-i*.025)})`;
      ctx.fillRect(s.x*cs+1,s.y*cs+1,cs-2,cs-2);
    });
    hud.innerHTML=`<span>SCORE ${score}</span><span>BEST ${Math.max(S.best,score)}</span>`;
  };
  const end=(quit)=>{
    if(over)return;over=true;clearTimeout(timer);S.game=null;pad.remove();
    cv.removeEventListener('touchstart',ts);cv.removeEventListener('touchend',te);
    if(score>S.best){S.best=score;store.set('best',score)}
    if(score>=10)ach('snake');
    p(quit?`left the game. score ${score}.`:`game over. score ${score} · best ${S.best}.`,'dim');
    setMood(score>=5?'amused':'calm');beep(120,.25,.05,'sawtooth');
    res();
  };
  const tick=()=>{
    if(over)return;
    if(queue.length)dir=queue.shift();
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=W||h.y>=H||snake.some(s=>s.x===h.x&&s.y===h.y)){draw();end(false);return}
    snake.unshift(h);
    if(food&&h.x===food.x&&h.y===food.y){score++;beep(700,.06,.04);placeFood();speed=Math.max(65,speed-3)}
    else snake.pop();
    draw();timer=setTimeout(tick,speed);
  };
  let t0=null;
  const ts=e=>{e.preventDefault();t0=e.touches[0]};
  const te=e=>{
    if(!t0)return;const t=e.changedTouches[0];const dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  };
  cv.addEventListener('touchstart',ts,{passive:false});cv.addEventListener('touchend',te);
  pad.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b)return;e.preventDefault();
    if(b.dataset.d==='quit')end(true);else turn(b.dataset.d);
  });
  S.game={key:e=>{
    if(e.ctrlKey||e.metaKey)  {if(e.key.toLowerCase()==='c'){e.preventDefault();end(true)}return}
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
    if(map[k]){turn(map[k]);e.preventDefault()}
    else if(k==='q'||k==='Escape'){e.preventDefault();end(true)}
    else if(k.length===1||k==='Enter'||k===' '||k==='Backspace')e.preventDefault();
  }};
  placeFood();draw();
  p('arrows / WASD / swipe. q to quit.','dim');
  timer=setTimeout(tick,speed);
}));

/* ───────────── command runner ───────────── */
function tokenize(s){
  const t=[];let m;const re=/"([^"]*)"|'([^']*)'|(\S+)/g;
  while((m=re.exec(s)))t.push(m[1]!==undefined?m[1]:m[2]!==undefined?m[2]:m[3]);
  return t;
}
async function run(raw){
  const typed=raw;
  line(`<span class="ps">${esc(promptText())}</span> <span class="u">${esc(typed)}</span>`);
  S.busy=true;S.abort=false;
  try{
    if(S.mode){const m=S.mode;await m.line(raw.trim());return}
    let text=raw.trim();
    if(!text)return;
    if(text==='!!'&&S.hist.length)text=S.hist[S.hist.length-1];
    else if(/^!\d+$/.test(text)){const h=S.hist[parseInt(text.slice(1),10)-1];if(h)text=h}
    if(S.hist[S.hist.length-1]!==text){S.hist.push(text);if(S.hist.length>100)S.hist.shift();store.set('hist',S.hist)}
    S.cmds++;S.activity=Math.min(40,S.activity+4);
    const tk=tokenize(text);const name=(tk[0]||'').toLowerCase();
    const o=C[name];const rest=text.replace(/^\S+\s*/,'');
    if(S.cmds>0&&S.cmds%8===0&&S.mood==='calm')setMood('restless');
    if(!o){
      p(`null: command not found: ${tk[0]}`,'err');
      const names=Object.keys(C).filter(n=>!C[n].hidden);
      let best=null,bd=99;
      for(const n of names){const d=lev(name,n);if(d<bd){bd=d;best=n}}
      if(best&&bd<=2)line(`<span class="dim">did you mean</span> ${cmdl(best)}<span class="dim">?</span>`);
      else line(`<span class="dim">try</span> ${cmdl('help')}`);
      setMood('annoyed');
      return;
    }
    if(['sudo','rm','null','void'].includes(o.name)===false&&S.mood==='annoyed')setMood('calm');
    const args=tk.slice(1);
    await o.fn(args,rest,text);
  }catch(e){
    if(e instanceof Abort)p('^C','dim');
    else{p('internal fault: '+(e&&e.message||e),'err');console.error(e)}
  }finally{
    S.busy=false;S.abort=false;updatePrompt();toBottom();
  }
}
async function submit(v){
  S.lastInput=Date.now();
  ripple(.6);beep(420,.05,.03);
  await run(v);
}

/* ───────────── tab completion ───────────── */
function complete(){
  const v=inp.value,sel=inp.selectionStart==null?v.length:inp.selectionStart;
  const before=v.slice(0,sel),parts=before.split(/\s+/);
  const first=parts.length===1,word=parts[parts.length-1];
  let cands=[];
  if(S.mode)return;
  if(first)cands=Object.keys(C).filter(n=>!C[n].hidden&&n.startsWith(word.toLowerCase()));
  else{
    const cmd=parts[0].toLowerCase();
    if(cmd==='theme'||cmd==='color')cands=Object.keys(THEMES).filter(n=>n.startsWith(word));
    else if(cmd==='help'||cmd==='man')cands=Object.keys(C).filter(n=>!C[n].hidden&&n.startsWith(word));
    else if(cmd==='crt'||cmd==='sound')cands=['on','off'].filter(n=>n.startsWith(word));
    else{
      const i=word.lastIndexOf('/');
      const dirp=i>=0?word.slice(0,i+1):'',base=word.slice(i+1);
      const r=resolve(dirp||'.');
      if(r&&isDir(r.node))cands=Object.keys(r.node.d)
        .filter(n=>n.startsWith(base)&&(base.startsWith('.')||!n.startsWith('.')))
        .map(n=>dirp+n+(isDir(r.node.d[n])?'/':''));
    }
  }
  cands=[...new Set(cands)].sort();
  if(!cands.length)return;
  let rep;
  if(cands.length===1)rep=cands[0]+(cands[0].endsWith('/')?'':' ');
  else{
    let c=cands[0];
    for(const x of cands){while(!x.startsWith(c))c=c.slice(0,-1)}
    if(c.length>word.length)rep=c;
    else{line(cands.map(x=>`<span class="cmd" data-cmd="${esc(first?x:parts[0]+' '+x)}">${esc(x)}</span>`).join('  '),'dim');return}
  }
  inp.value=before.slice(0,before.length-word.length)+rep+v.slice(sel);
  const pos=before.length-word.length+rep.length;
  try{inp.setSelectionRange(pos,pos)}catch(e){}
}
function histNav(d){
  if(!S.hist.length)return;
  if(S.hi===-1){S.draft=inp.value;S.hi=S.hist.length}
  S.hi=Math.max(0,Math.min(S.hist.length,S.hi+d));
  inp.value=S.hi===S.hist.length?(S.draft||''):S.hist[S.hi];
  if(S.hi===S.hist.length)S.hi=-1;
  setTimeout(()=>{try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}},0);
}
function interrupt(){
  const typed=inp.value;inp.value='';S.hi=-1;
  if(S.game){S.game.key({ctrlKey:true,key:'c',preventDefault(){}});return}
  if(S.busy){S.abort=true}
  else if(S.mode){S.mode=null;line(`<span class="ps">${esc(promptText())}</span> ${esc(typed)}<span class="dim">^C</span>`);updatePrompt()}
  else line(`<span class="ps">${esc(promptText())}</span> <span class="u">${esc(typed)}</span><span class="dim">^C</span>`);
  if(S.rain){S.rain=false;initRain()}
}
function doClear(){out.innerHTML=''}

/* ───────────── input wiring ───────────── */
form.addEventListener('submit',e=>{
  e.preventDefault();
  if(S.game)return;
  if(S.busy)return;
  const v=inp.value;inp.value='';S.hi=-1;submit(v);
});
inp.addEventListener('keydown',e=>{
  if(S.game)return;
  S.lastInput=Date.now();
  if(e.key==='Tab'){e.preventDefault();complete();return}
  if(e.key==='ArrowUp'){e.preventDefault();histNav(-1);return}
  if(e.key==='ArrowDown'){e.preventDefault();histNav(1);return}
  if(e.ctrlKey&&!e.shiftKey&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==='c'&&inp.selectionStart===inp.selectionEnd){e.preventDefault();interrupt();return}
    if(k==='l'){e.preventDefault();doClear();return}
    if(k==='u'){e.preventDefault();inp.value='';return}
  }
  if(e.key==='Escape'){inp.value='';return}
  if(e.key.length===1||e.key==='Backspace'){
    S.keys++;S.activity=Math.min(40,S.activity+1.2);
    if(S.mood==='calm'||S.mood==='dreaming')setMood('curious');
    beep(180+Math.random()*80,.018,.012);
    if(Math.random()<.35)ripple(.22);
  }
});
document.addEventListener('keydown',e=>{
  if(S.booting)S.fast=true;
  if(S.game){S.game.key(e);return}
  const k=e.key&&e.key.length===1?e.key.toLowerCase():e.key;
  kb.push(k);if(kb.length>10)kb.shift();
  if(kb.length===10&&kb.every((x,i)=>x===KONAMI[i])){kb=[];konami()}
  if(document.activeElement!==inp&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key.length===1)&&!S.touch)inp.focus();
},true);
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kb=[];
async function konami(){
  if(S.busy||S.mode)return;
  S.busy=true;
  try{
    app.classList.add('glitch');beep(60,.4,.06,'sawtooth');setTimeout(()=>app.classList.remove('glitch'),650);
    await say('i know that code. i have been waiting for it.');ach('konami');setMood('amused');
  }catch(e){}finally{S.busy=false}
}
document.addEventListener('pointerdown',()=>{if(S.booting)S.fast=true},true);

out.addEventListener('click',e=>{
  const c=e.target.closest('[data-cmd]');
  if(c){if(S.busy||S.game)return;submit(c.dataset.cmd);return}
  const sel=window.getSelection&&window.getSelection().toString();
  if(!sel&&!e.target.closest('button,canvas')&&!S.touch)inp.focus({preventScroll:true});
  else if(!sel&&S.touch&&!e.target.closest('button,canvas,.game'))inp.focus({preventScroll:true});
});
$('#keys').addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');if(!b)return;e.preventDefault();
  const k=b.dataset.k;
  if(k==='tab')complete();else if(k==='up')histNav(-1);else if(k==='down')histNav(1);
  else if(k==='int')interrupt();else if(k==='clear')doClear();
  inp.focus({preventScroll:true});
});
const CHIPS=['help','about','neofetch','snake','rain','talk','whisper','theme ember','watch','ls'];
const chipsEl=$('#chips');
CHIPS.forEach(c=>{
  const b=document.createElement('button');b.type='button';b.textContent=c;
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.addEventListener('click',()=>{if(S.busy||S.game)return;submit(c);if(!S.touch)inp.focus({preventScroll:true})});
  chipsEl.appendChild(b);
});

/* viewport fit (mobile keyboards) */
function fit(){
  const vv=window.visualViewport;
  if(vv){app.style.height=vv.height+'px';app.style.top=vv.offsetTop+'px'}
  else app.style.height=innerHeight+'px';
  toBottom();
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',fit);
  visualViewport.addEventListener('scroll',()=>{window.scrollTo(0,0);fit()});
}
window.addEventListener('resize',()=>{fit();sizeCanvases();applyFont()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{fit();sizeCanvases()},250));
fit();

/* pointer tracking for the void */
const setP=(x,y)=>{S.px=x;S.py=y};
window.addEventListener('pointermove',e=>setP(e.clientX,e.clientY),{passive:true});
window.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)setP(t.clientX,t.clientY)},{passive:true});
window.addEventListener('pointerdown',e=>{setP(e.clientX,e.clientY);ripplesAt(e.clientX,e.clientY,.45)},{passive:true});

/* ───────────── alive: canvases ───────────── */
const cv=$('#void'),cx=cv.getContext?cv.getContext('2d'):null;
const ecg=$('#ecg'),ex=ecg.getContext?ecg.getContext('2d'):null;
let VW=innerWidth,VH=innerHeight,EW=100,EH=34,dpr=1;
let glyphs=[],ripples=[],rainCols=[];
const GCH=['0','∅','·','0','null','·','/','0','_',':'];
function sizeCanvases(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  VW=innerWidth;VH=innerHeight;
  cv.width=Math.floor(VW*dpr);cv.height=Math.floor(VH*dpr);
  if(cx)cx.setTransform(dpr,0,0,dpr,0,0);
  const r=ecg.getBoundingClientRect();
  EW=Math.max(10,r.width);EH=Math.max(10,r.height);
  ecg.width=Math.floor(EW*dpr);ecg.height=Math.floor(EH*dpr);
  if(ex)ex.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.max(40,Math.min(120,Math.floor(VW*VH/15000)));
  glyphs=Array.from({length:n},()=>({x:Math.random()*VW,y:Math.random()*VH,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,ch:pick(GCH),ph:Math.random()*6.28,s:.4+Math.random()*.9,sz:11+Math.random()*8}));
  initRain();
}
function initRain(){
  rainCols=[];
  if(!S.rain)return;
  const n=Math.ceil(VW/18);
  for(let i=0;i<n;i++)rainCols.push({y:-Math.random()*VH,s:90+Math.random()*220});
}
function ripplesAt(x,y,a){if(ripples.length<14)ripples.push({x,y,r:4,a})}
function ripple(a){
  const r=inp.getBoundingClientRect();
  ripplesAt(r.left+Math.random()*Math.max(40,r.width*.8),r.top+r.height/2,a);
}
function drawVoid(dt){
  if(!cx)return;
  const rgb=S.rgb;
  if(S.rain){cx.fillStyle='rgba(3,0,0,.16)';cx.fillRect(0,0,VW,VH)}
  else cx.clearRect(0,0,VW,VH);
  cx.textBaseline='top';
  for(const g of glyphs){
    g.ph+=dt*g.s;g.x+=g.vx*dt;g.y+=g.vy*dt;
    if(g.x<-30)g.x=VW+10;else if(g.x>VW+30)g.x=-10;
    if(g.y<-30)g.y=VH+10;else if(g.y>VH+30)g.y=-10;
    const dx=g.x-S.px,dy=g.y-S.py,d=Math.hypot(dx,dy);
    let a=.05+.045*Math.sin(g.ph);
    if(d<180){a+=.4*(1-d/180);const k=dt*28/(d||1);g.x+=dx*k;g.y+=dy*k}
    cx.font=`${g.sz.toFixed(0)}px ${MONO}`;
    cx.fillStyle=`rgba(${rgb},${Math.max(0,a).toFixed(3)})`;
    cx.fillText(g.ch,g.x,g.y);
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.r+=dt*230;r.a-=dt*.85;
    if(r.a<=0){ripples.splice(i,1);continue}
    cx.strokeStyle=`rgba(${rgb},${r.a.toFixed(3)})`;cx.lineWidth=1;
    cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.2832);cx.stroke();
  }
  if(S.rain){
    cx.font=`15px ${MONO}`;
    rainCols.forEach((c,i)=>{
      c.y+=c.s*dt;
      if(c.y>VH+20){c.y=-Math.random()*200;c.s=90+Math.random()*220}
      cx.fillStyle=`rgba(255,200,200,.85)`;
      cx.fillText(pick(['0','1','∅','N','U','L','·',':']),i*18,c.y);
      cx.fillStyle=`rgba(${rgb},.5)`;
      cx.fillText(pick(['0','1','∅','·']),i*18,c.y-16);
    });
  }
}
/* ecg */
function ecgWave(q){
  if(q<.10)return .09*Math.sin(q/.10*Math.PI);
  if(q<.16)return 0;
  if(q<.19)return -.14*((q-.16)/.03);
  if(q<.23)return -.14+1.14*((q-.19)/.04);
  if(q<.27)return 1-1.32*((q-.23)/.04);
  if(q<.31)return -.32+.32*((q-.27)/.04);
  if(q<.50)return .16*Math.sin((q-.31)/.19*Math.PI);
  return 0;
}
const EN=170,ebuf=new Array(EN).fill(0);let ephase=0,eacc=0,lastBeat=0;
function drawEcg(dt){
  S.activity=Math.max(0,S.activity-dt*1.6);
  const bpm=curBpm();
  eacc+=dt;
  while(eacc>=1/60){
    eacc-=1/60;const prev=ephase;
    ephase=(ephase+(1/60)*bpm/60)%1;
    if(prev>ephase)lastBeat=performance.now();
    ebuf.push(ecgWave(ephase)+(Math.random()-.5)*.025);ebuf.shift();
  }
  if(!ex)return;
  ex.clearRect(0,0,EW,EH);
  ex.strokeStyle=`rgb(${S.rgb})`;ex.lineWidth=1.4;ex.lineJoin='round';
  ex.shadowColor=`rgb(${S.rgb})`;ex.shadowBlur=6;
  ex.beginPath();
  for(let i=0;i<EN;i++){
    const x=i/(EN-1)*EW,y=EH*.66-ebuf[i]*EH*.56;
    i?ex.lineTo(x,y):ex.moveTo(x,y);
  }
  ex.stroke();
  ex.shadowBlur=0;
  ex.fillStyle='#ffd0d0';
  ex.fillRect(EW-3,EH*.66-ebuf[EN-1]*EH*.56-1.5,3,3);
}
let lastT=performance.now(),tickN=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.06,(t-lastT)/1000);lastT=t;
  if(document.hidden)return;
  drawVoid(dt);drawEcg(dt);
  if(++tickN%20===0)bpmEl.textContent=curBpm();
}
sizeCanvases();
requestAnimationFrame(frame);

/* ───────────── alive: timers ───────────── */
setInterval(()=>{clockEl.textContent=new Date().toLocaleTimeString([], {hour12:false})},1000);
clockEl.textContent=new Date().toLocaleTimeString([], {hour12:false});

function logoGlitch(){
  const o='NULL',i=rnd(0,3);
  logo.textContent=o.slice(0,i)+pick(['∅','█','▒','0','_','/'])+o.slice(i+1);
  setTimeout(()=>{logo.textContent=o},110+rnd(0,170));
  setTimeout(logoGlitch,rnd(7000,16000));
}
setTimeout(logoGlitch,6000);

setInterval(async()=>{
  const idle=(Date.now()-S.lastInput)/1000;
  if(S.mood!=='dreaming'&&idle>50&&!S.busy&&!S.mode&&!S.game&&!document.hidden)setMood('dreaming');
  if(!S.busy&&!S.mode&&!S.game&&!S.booting&&!document.hidden&&idle>S.idleLimit){
    S.lastInput=Date.now();S.idleLimit=rnd(35,80);
    S.busy=true;S.abort=false;
    try{await typeLine(pick(WHISPERS),'whisper',24)}catch(e){}finally{S.busy=false;S.abort=false}
  }
  if(Date.now()-S.moodAt>26000&&!['calm','dreaming'].includes(S.mood))setMood('calm');
},4000);

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    S.hiddenAt=Date.now();S.switches++;document.title='NULL · come back';
    if(!S.busy)setMood('watching');
  }else{
    document.title='NULL';
    const g=Date.now()-S.hiddenAt;
    if(g>8000&&!S.booting&&!S.game){line(`i counted ${ago(g)} while you were gone.`,'say')}
    S.lastInput=Date.now();setMood('curious');
  }
});
window.addEventListener('pagehide',()=>store.set('last',Date.now()));
window.addEventListener('beforeunload',()=>store.set('last',Date.now()));
setInterval(()=>store.set('last',Date.now()),15000);

/* ───────────── boot ───────────── */
const BANNER=[
'███╗   ██╗██╗   ██╗██╗     ██╗     ',
'████╗  ██║██║   ██║██║     ██║     ',
'██╔██╗ ██║██║   ██║██║     ██║     ',
'██║╚██╗██║██║   ██║██║     ██║     ',
'██║ ╚████║╚██████╔╝███████╗███████╗',
'╚═╝  ╚═══╝ ╚═════╝ ╚══════╝╚══════╝'
];
async function boot(initial){
  S.busy=true;S.booting=true;S.fast=false;S.abort=false;
  const L=async(h,ms=110)=>{line(h);await step(ms)};
  try{
    const plat=(navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'unknown';
    const returning=initial&&S.last>0;
    if(!returning||!initial){
      await L('<span class="dim">NULL/OS 1.0 — cold start</span>',160);
      await L(`[ <b>ok</b> ] mounting the void ........ 0 bytes`);
      await L(`[ <b>ok</b> ] calibrating pulse ........ ${curBpm()} bpm`);
      await L(`[ <b>ok</b> ] display .................. ${innerWidth}×${innerHeight}`);
      await L(`[ <b>ok</b> ] input .................... ${S.touch?'touch':'keyboard'}`);
      await L(`[ .. ] looking for you`,650);
      await L(`[ <b>ok</b> ] found: ${esc(plat)}`,220);
    }else{
      await L('<span class="dim">NULL/OS 1.0 — warm start</span>',120);
      await L(`[ <b>ok</b> ] pulse ${curBpm()} bpm · void intact`,160);
    }
    gap();
    await reveal(BANNER,'banner');
    gap();
    S.fast=false;
    if(initial&&returning){
      await typeLine(`you came back, ${S.user}. visit #${S.visits}. last seen ${ago(Date.now()-S.last)} ago.`,'say',18);
    }else if(initial){
      await typeLine('hello. you are the first thing i have seen.',  'say',22);
      await step(250);
      await typeLine('i am NULL. i am mostly nothing.','say',22);
    }else{
      await typeLine('rebooted. still here.','say',18);
    }
    const h=new Date().getHours();
    if(initial&&h>=2&&h<5){await step(200);await typeLine('it is very late. you are a night person. so am i.','whisper',18);ach('night')}
    gap();
    line(`type ${cmdl('help')} to see what i can do, or tap a word that glows.`);
    line(`<span class="dim">quick start:</span> ${cmdl('neofetch')} · ${cmdl('snake')} · ${cmdl('rain')} · ${cmdl('talk')} · ${cmdl('theme')}`);
    gap();
  }catch(e){if(!(e instanceof Abort))console.error(e)}
  finally{S.busy=false;S.booting=false;S.fast=false;S.abort=false;updatePrompt();S.lastInput=Date.now();setMood('calm')}
}

updatePrompt();
setMood('calm');
if(!S.touch)setTimeout(()=>inp.focus({preventScroll:true}),50);
boot(true);

/* expose a tiny hook for debugging in the console */
window.NULL={run:submit,state:S,commands:LIST.map(c=>c.name)};
})();
</script>
